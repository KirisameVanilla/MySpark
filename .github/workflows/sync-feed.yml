name: Sync social feed
# Pulls Instagram posts into public/feed (see README).

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync-feed
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      # Instagram returns a new token string on every refresh. Store it so the
      # secret never reaches its 60-day expiry. Needs a GH_PAT secret (see README).
      - name: Save refreshed Instagram token
        if: ${{ hashFiles('.ig-token') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT not set — IG_ACCESS_TOKEN will expire 60 days after you last set it."
          else
            gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < .ig-token
          fi
          rm -f .ig-token

      - name: Commit updated feed
        run: |
          git add public/feed
          if git diff --cached --quiet; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git commit -m "chore: sync social feed"
          git push
